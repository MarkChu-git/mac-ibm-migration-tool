name: Build Installer
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags: [ "v-*" ]
  pull_request:
    branches: [ "main", "dev" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable
      - name: Checkout project
        uses: actions/checkout@v7
      - name: Build and package
        id: package
        shell: bash
        run: bash .github/scripts/build-installer.sh
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.pkg }}
          archive: false
          if-no-files-found: error
          retention-days: 30
